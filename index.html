<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velocity Movement Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the saved GR-74 mode before first paint to avoid a theme flash.
    try {
      var mode = localStorage.getItem('velocity-ui-theme');
      if (mode === 'tactical' || mode === 'slick' || mode === 'daylight') {
        document.documentElement.classList.add('mode-' + mode);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="hud"></div>
  <div id="loading">Loading movement sandbox…</div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
