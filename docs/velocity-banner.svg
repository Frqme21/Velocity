<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Velocity first person parkour</title>
  <desc id="desc">Dark velocity themed banner with orange and cyan accents, a grapple ring, and the text velocity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.55" stop-color="#121722"/>
      <stop offset="1" stop-color="#0a1a1d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.55" stop-color="#ff8b6f"/>
      <stop offset="1" stop-color="#5fe3f2"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="1" stop-color="#5fe3f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5fe3f2" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5fe3f2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="965" cy="150" r="190" fill="url(#glow)"/>

  <g opacity="0.55">
    <path d="M720 300 L1010 0" stroke="url(#stroke)" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M770 300 L1060 0" stroke="url(#stroke)" stroke-width="1" stroke-opacity="0.22"/>
    <path d="M820 300 L1110 0" stroke="url(#stroke)" stroke-width="1" stroke-opacity="0.16"/>
  </g>

  <g transform="translate(965 150) rotate(-18)">
    <ellipse rx="92" ry="58" fill="none" stroke="url(#stroke)" stroke-width="9"/>
    <ellipse rx="92" ry="58" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="92" cy="0" r="10" fill="#5fe3f2"/>
    <circle cx="92" cy="0" r="20" fill="none" stroke="#5fe3f2" stroke-opacity="0.35"/>
  </g>

  <g fill="#5fe3f2">
    <circle cx="103" cy="54" r="4"/>
    <circle cx="123" cy="54" r="4" opacity="0.5"/>
    <circle cx="143" cy="54" r="4" opacity="0.25"/>
  </g>

  <text x="72" y="98" fill="#ff8b6f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">VELOCITY // MOVEMENT SANDBOX</text>
  <text x="66" y="178" fill="url(#title)" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="5">VELOCITY</text>
  <text x="72" y="218" fill="#b8c0cc" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1">First person parkour. Real physics. Live level editor.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">
    <rect x="72" y="242" width="142" height="28" rx="14" fill="#ff6a4d" fill-opacity="0.14" stroke="#ff6a4d" stroke-opacity="0.65"/>
    <text x="91" y="260" fill="#ffb4a4">BABYLON.JS</text>
    <rect x="226" y="242" width="128" height="28" rx="14" fill="#5fe3f2" fill-opacity="0.12" stroke="#5fe3f2" stroke-opacity="0.6"/>
    <text x="244" y="260" fill="#aaf3fb">RAPIER3D</text>
    <rect x="366" y="242" width="78" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="385" y="260" fill="#dfe4ec">VITE</text>
    <rect x="456" y="242" width="92" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="474" y="260" fill="#dfe4ec">NEXT.JS</text>
  </g>
</svg>
