<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Velocity — Level Editor</title>
  <link rel="stylesheet" href="/src/editor/editor.css">
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-group">
      <label>Level</label>
      <input id="level-name" type="text" value="" placeholder="level name (e.g. example)">
    </div>
    <div class="toolbar-group">
      <button id="btn-new">New</button>
      <button id="btn-save">Save</button>
      <button id="btn-load">Load</button>
      <button id="btn-export">Export JSON</button>
      <button id="btn-copy">Copy JSON</button>
      <button id="btn-play" class="primary">Play in Game</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-gizmo-move" title="Move (W)">Move</button>
      <button id="btn-gizmo-rotate" title="Rotate (E)">Rotate</button>
      <button id="btn-gizmo-scale" title="Scale (R)">Scale</button>
    </div>
    <div class="toolbar-group">
      <label class="check"><input id="wallrun-strict" type="checkbox"> Wall-run only on tagged surfaces</label>
      <label class="check"><input id="mantle-strict" type="checkbox"> Mantle only on tagged surfaces</label>
    </div>
    <div class="toolbar-group">
      <span id="status" class="status">Ready</span>
    </div>
  </div>

  <div class="workspace">
    <aside class="panel panel-left">
      <div class="panel-title">Components</div>
      <div class="palette" id="palette"></div>
    </aside>

    <div class="viewport" id="viewport">
      <canvas id="editor-canvas"></canvas>
      <div class="view-hint">Left-click to select &bull; Left-drag to move &bull; Right-drag to pan &bull; Scroll to zoom &bull; WASD to fly &bull; Q/E for up/down</div>
    </div>

    <aside class="panel panel-right">
      <div class="panel-title">Inspector</div>
      <div class="inspector" id="inspector">
        <div class="empty">Select a component to edit it.</div>
      </div>
    </aside>
  </div>

  <script type="module" src="/src/editor/editor.ts"></script>
</body>
</html>
