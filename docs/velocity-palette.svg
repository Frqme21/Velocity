<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Velocity color system</title>
  <desc id="desc">Five color swatches used by the Velocity game and showcase.</desc>
  <rect width="1200" height="220" fill="#0b0e14"/>
  <text x="18" y="28" fill="#8b95a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">COLOR SYSTEM / SITE TOKENS</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="18" y="44" width="220" height="120" rx="14" fill="#10131a" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="34" y="150" fill="#8b95a5" font-size="13">#10131A</text>
    <text x="18" y="190" fill="#f4f6f8" font-size="14">BG LOW</text>
    <text x="18" y="209" fill="#667182" font-size="11">--bg-low</text>

    <rect x="254" y="44" width="220" height="120" rx="14" fill="#1c202a" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="270" y="150" fill="#aab3c0" font-size="13">#1C202A</text>
    <text x="254" y="190" fill="#f4f6f8" font-size="14">SURFACE</text>
    <text x="254" y="209" fill="#667182" font-size="11">--surface</text>

    <rect x="490" y="44" width="220" height="120" rx="14" fill="#5fe3f2">
      <animate attributeName="fill" values="#5fe3f2;#69eaf8;#5fe3f2" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="506" y="150" fill="#082025" font-size="13">#5FE3F2</text>
    <text x="490" y="190" fill="#f4f6f8" font-size="14">SECONDARY</text>
    <text x="490" y="209" fill="#667182" font-size="11">--secondary</text>

    <rect x="726" y="44" width="220" height="120" rx="14" fill="#ff6a4d">
      <animate attributeName="fill" values="#ff6a4d;#ff7f61;#ff6a4d" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="742" y="150" fill="#2b0b05" font-size="13">#FF6A4D</text>
    <text x="726" y="190" fill="#f4f6f8" font-size="14">PRIMARY</text>
    <text x="726" y="209" fill="#667182" font-size="11">--primary</text>

    <rect x="962" y="44" width="220" height="120" rx="14" fill="#f4f6f8" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="978" y="150" fill="#33404f" font-size="13">#F4F6F8</text>
    <text x="962" y="190" fill="#f4f6f8" font-size="14">ON SURFACE</text>
    <text x="962" y="209" fill="#667182" font-size="11">--on-surface</text>
  </g>
</svg>
